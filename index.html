<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orphe Recorder v1.0 — 走行データ収録（両足・区間マーカー・時計同期）</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 16px; line-height: 1.6; }
  h1 { font-size: 1.2rem; margin: 0 0 4px; }
  .sub { color: #888; font-size: .85rem; margin: 0 0 12px; }
  #diag { font-family: ui-monospace, monospace; font-size: .8rem; white-space: pre;
          background: rgba(128,128,128,.12); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  button { font-size: 1.05rem; padding: 13px 18px; border-radius: 12px; border: none;
           background: #2563eb; color: #fff; width: 100%; margin-bottom: 8px; }
  button:disabled { background: #9ca3af; }
  button.rec { background: #16a34a; }
  button.stop { background: #dc2626; }
  button.ghost { background: rgba(128,128,128,.2); color: inherit; }
  /* 押せることが見た目で分かるユーティリティボタン（.ghostは薄すぎて無効に見えたため別クラス） */
  button.util { background: transparent; color: #2563eb; border: 1.5px solid #2563eb; font-size: .95rem; padding: 11px 12px; }
  button.util:disabled { color: #9ca3af; border-color: #9ca3af; background: transparent; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  label.lbl { font-size: .8rem; color: #888; display:block; margin: 4px 0 2px; }
  input[type=text] { width: 100%; box-sizing: border-box; font-size: 1rem; padding: 10px 12px;
           border-radius: 10px; border: 1px solid rgba(128,128,128,.4); background: transparent; color: inherit; margin-bottom: 10px; }
  .foot { border: 1px solid rgba(128,128,128,.25); border-radius: 12px; padding: 10px; }
  .foot h2 { font-size: .95rem; margin: 0 0 6px; }
  .foot .st { font-size: .8rem; color:#888; margin-bottom: 8px; min-height: 1.2em; }
  .foot.on { border-color: #16a34a; }
  .m { display:flex; justify-content:space-between; font-variant-numeric: tabular-nums; font-size:.85rem; }
  .m b { font-weight:700; }
  .warn { color:#dc2626; }
  #recbar { margin: 14px 0 6px; }
  #elapsed { text-align:center; font-size:1.6rem; font-weight:700; font-variant-numeric: tabular-nums; margin: 6px 0; }
  /* 区間マーカー：走る直前/直後に押す。狙いを外しにくいよう大きく */
  #markbar { display:none; margin: 4px 0 10px; }
  button#mark { font-size: 1.5rem; font-weight: 700; padding: 30px 18px; background: #7c3aed; }
  button#mark.ending { background: #ea580c; }
  button#undo { font-size: .9rem; padding: 9px 14px; }
  #marks { font-family: ui-monospace, monospace; font-size: .82rem; white-space: pre-wrap;
           background: rgba(124,58,237,.13); border-radius: 10px; padding: 8px 12px; margin-top: 8px; min-height: 1.2em; }
  #downloads { margin-top: 12px; }
  #downloads a { display:block; text-align:center; text-decoration:none; }
  #summary { font-family: ui-monospace, monospace; font-size:.78rem; white-space:pre-wrap;
             background: rgba(128,128,128,.12); border-radius:10px; padding:10px 12px; margin-top:10px; }
  #log { font-family: ui-monospace, monospace; font-size: .75rem; white-space: pre-wrap;
         color: #dc2626; min-height: 1.2em; margin-top: 10px; }
  /* 全画面フラッシュ＝動画側の同期マーカー。小さいボタンの色替えより見つけやすい。
     pointer-events:none なので、光っている間もボタンは押せる */
  #flash { position: fixed; inset: 0; display: none; z-index: 9999; pointer-events: none; }
</style>
</head>
<body>
  <h1>Orphe Recorder v1.0</h1>
  <p class="sub">走行データ収録（両足L/R・ビープ同期・区間マーカー・CSV保存）。まず診断4行を確認 → 左右を接続 → 収録 → 走る直前と直後に紫のボタン。全画面フラッシュ＝開始:緑 / 停止:赤 / 区間開始:紫 / 区間終了:橙。動画は緑に光ったコマに合わせる。</p>

  <div id="diag">診断中…</div>

  <label class="lbl">ファイル名ラベル（例: run1）</label>
  <input type="text" id="label" value="run" autocomplete="off">

  <div class="row2">
    <div class="foot" id="footL">
      <h2>左足 (L)</h2>
      <div class="st" id="stL">未接続</div>
      <button id="connL">接続 左足</button>
      <div class="m"><span>レート</span><b id="hzL">– Hz</b></div>
      <div class="m"><span>サンプル</span><b id="nL">0</b></div>
      <div class="m"><span>欠損</span><b id="lostL">0</b></div>
      <div class="m"><span>電池</span><b id="batL">–</b></div>
      <div class="m"><span>時計</span><b id="clkL">–</b></div>
    </div>
    <div class="foot" id="footR">
      <h2>右足 (R)</h2>
      <div class="st" id="stR">未接続</div>
      <button id="connR">接続 右足</button>
      <div class="m"><span>レート</span><b id="hzR">– Hz</b></div>
      <div class="m"><span>サンプル</span><b id="nR">0</b></div>
      <div class="m"><span>欠損</span><b id="lostR">0</b></div>
      <div class="m"><span>電池</span><b id="batR">–</b></div>
      <div class="m"><span>時計</span><b id="clkR">–</b></div>
    </div>
  </div>
  <div class="row2">
    <button id="bat" class="util">🔋 電池を読み直す</button>
    <button id="clk" class="util">🕐 時計を合わせ直す</button>
  </div>

  <div id="recbar">
    <button id="rec" class="rec" disabled>● 収録開始</button>
    <button id="stop" class="stop" disabled style="display:none">■ 収録停止</button>
  </div>
  <div id="elapsed"></div>

  <div id="markbar">
    <button id="mark">▶ 区間 開始</button>
    <button id="undo" class="ghost">↩ 直前のマーカーを取り消し</button>
    <div id="marks">マーカーなし</div>
  </div>

  <div id="downloads"></div>
  <pre id="summary" style="display:none"></pre>
  <div id="log"></div>
  <div id="flash"></div>

  <!-- ライブラリ（同梱・CDN依存なし） -->
  <script src="js/ORPHE-CORE.js"></script>
  <script src="js/float16.min.js"></script>
  <script src="js/quaternion.js"></script>

  <!-- ① 診断だけ（ES5・古いChromeでも必ず動く。ここは絶対落とさない） -->
  <script>
    (function () {
      function el(id){ return document.getElementById(id); }
      window.__logLine = function (m) { var d = el('log'); if (d) d.textContent += m + '\n'; };
      window.addEventListener('error', function (e) { if (window.__logLine) window.__logLine('ERR: ' + e.message); });
      var ua = navigator.userAgent, m = ua.match(/Chrome\/(\d+)/), cv = m ? m[1] : '不明';
      var L = [];
      L.push('Chrome バージョン : ' + cv + (m && parseInt(cv,10) < 80 ? '  ← 古すぎ(80未満)' : ''));
      L.push('セキュア(HTTPS)   : ' + (window.isSecureContext ? 'OK' : 'NG'));
      L.push('Web Bluetooth     : ' + (navigator.bluetooth ? '対応' : '非対応 ✗'));
      L.push('ライブラリ Orphe   : ' + (typeof Orphe !== 'undefined' ? 'ロード済' : '未ロード ✗'));
      el('diag').textContent = L.join('\n');
    })();
  </script>

  <!-- ② 本体 -->
  <script>
    const CSV_HEADER = 'timestamp,acc_x,acc_y,acc_z,gyro_x,gyro_y,gyro_z,quat_x,quat_y,quat_z,quat_w';
    // 既存データと同じスケールで残す: acc/gyro=正規化値(解析側で ×16 / ×2000)、quat=生int16、timestamp=デバイス時刻(PC時計に同期)
    const feet = {
      L: { key:'L', id:0, core:null, connected:false, rec:[], n:0, lost:0, rateWin:[], lastTs:0 },
      R: { key:'R', id:1, core:null, connected:false, rec:[], n:0, lost:0, rateWin:[], lastTs:0 },
    };
    let recording = false, recStart = 0, recEnd = 0, wakeLock = null, audioCtx = null;
    const startBeepTs = {}, endBeepTs = {};
    let markers = [];   // 区間マーカー（走る直前/直後に押す）。フラットなイベント列で持つ
    const $ = id => document.getElementById(id);

    // ---- サンプル受信（gotGyro時点で core.acc / core.quat も同一サンプル値） ----
    function onSample(F) {
      const c = F.core, ts = (c.gyro && c.gyro.timestamp) ? c.gyro.timestamp : Date.now();
      F.n++; F.lastTs = ts;
      const now = performance.now();
      F.rateWin.push(now);
      while (F.rateWin.length && F.rateWin[0] < now - 1000) F.rateWin.shift();
      if (recording) {
        const a = c.acc, g = c.gyro, q = c.quat;
        F.rec.push(
          ts + ',' +
          a.x + ',' + a.y + ',' + a.z + ',' +
          g.x + ',' + g.y + ',' + g.z + ',' +
          Math.round(q.x*32768) + ',' + Math.round(q.y*32768) + ',' + Math.round(q.z*32768) + ',' + Math.round(q.w*32768)
        );
      }
    }

    async function connect(F, btn, stEl) {
      if (!navigator.bluetooth) { stEl.textContent = 'Web Bluetooth 非対応'; return; }
      if (typeof Orphe === 'undefined') { stEl.textContent = 'ライブラリ未ロード'; return; }
      ensureAudio();
      btn.disabled = true; stEl.textContent = '接続中… ダイアログでシューズを選択';
      try {
        F.core = new Orphe(F.id);
        F.core.setup();
        F.core.gotGyro = function () { onSample(F); };
        F.core.lostData = function () { F.lost++; };
        // range: 既存解析に合わせ acc=16g / gyro=2000dps。useSharedBridgeは2台同時のため無効化
        await F.core.begin('SENSOR_VALUES', { range: { acc: 16, gyro: 2000 }, useSharedBridge: false });
        F.connected = true;
        stEl.textContent = '接続済み ✓ 受信中';
        $('foot'+F.key).classList.add('on');
        btn.textContent = '再接続 ' + (F.key==='L'?'左足':'右足');
        btn.disabled = false;
        updateRecEnabled();
        readBattery(F);   // 接続直後に一度読む（失敗しても接続は壊さない）
        syncClock(F);     // ★シューズ側の時計をスマホに合わせる（これを呼ばないとCSVの時刻が数百ms〜数秒ずれる）
      } catch (e) {
        const msg = (e && e.message) ? e.message : String(e);
        stEl.textContent = '接続失敗: ' + msg;
        window.__logLine('begin失敗('+F.key+'): ' + msg);
        btn.disabled = false;
      }
    }
    $('connL').onclick = function(){ connect(feet.L, this, $('stL')); };
    $('connR').onclick = function(){ connect(feet.R, this, $('stR')); };

    function updateRecEnabled() {
      $('rec').disabled = recording || !(feet.L.connected || feet.R.connected);
    }

    // ---- ビープ（Web Audio）----
    function ensureAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) { window.__logLine('audio初期化失敗: ' + e.message); }
    }
    function beep(freq, ms) {
      if (!audioCtx) return;
      const t0 = audioCtx.currentTime;
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = 'square'; osc.frequency.value = freq || 1320;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.6, t0 + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + (ms||130)/1000);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(t0); osc.stop(t0 + (ms||130)/1000 + 0.02);
    }

    // ---- 共通：BLEの読みが返らないときにボタンが固まらないようにする ----
    function withTimeout(p, ms, label) {
      return Promise.race([p, new Promise((_, rej) =>
        setTimeout(() => rej(new Error(label + ' が ' + ms + 'ms で応答しません')), ms))]);
    }

    // Web Bluetooth は requestDevice の optionalServices に無いサービスへのアクセスを禁じる。
    // ライブラリはORPHE独自サービスしか登録しないので、標準のバッテリーサービスを足しておく。
    // （シューズが標準サービスを持っていれば％で読める。持っていなければ従来の3段階にフォールバック）
    (function patchBluetoothForBattery() {
      if (!navigator.bluetooth || !navigator.bluetooth.requestDevice) return;
      const orig = navigator.bluetooth.requestDevice.bind(navigator.bluetooth);
      navigator.bluetooth.requestDevice = function (opts) {
        try {
          const os = ((opts && opts.optionalServices) || []).slice();
          if (os.indexOf('battery_service') === -1) os.push('battery_service');
          opts = Object.assign({}, opts || {}, { optionalServices: os });
        } catch (e) { window.__logLine('optionalServices追加に失敗: ' + e.message); }
        return orig(opts);
      };
    })();

    // ---- 時計合わせ ----
    // CSVのtimestampは「シューズ内蔵RTCの時刻」。start_beep_epoch_ms や マーカーの t_s は
    // スマホの時計。この2つを合わせておかないと、動画同期も区間の切り出しも数百ms〜数秒ずれる。
    // （実測：260626は0.28〜0.92s、2026-07-28は1.06s ずれていた。1試技の中では一定＝時計のズレ）
    // ★シューズの時計を直接読んで、スマホとの差を測る。
    //   これは「時計のズレ」だけを見る（サンプル列の遅延は含まない）。
    //   ライブラリの getDateTime は new Date(y, month, ...) に1始まりの月を渡していて
    //   月が1つ進むバグがあるため、date.getTime() は使わず時分秒だけを取り出し、
    //   センサ側の timestamp と同じ作り方（今日の日付＋時分秒）に揃えて比較する。
    async function measureClockOffset(F) {
      const t0 = Date.now();
      const dt = await withTimeout(F.core.getDateTime(), 5000, '時計の読み出し');
      const t1 = Date.now();
      const d = dt.date;
      const shoe = new Date();
      shoe.setHours(d.getHours(), d.getMinutes(), d.getSeconds(), d.getMilliseconds());
      // シューズが自分の時計を読んだ実時刻 ≒ 往復の中点
      return Math.round((t0 + t1) / 2 - shoe.getTime());   // + なら シューズが遅れている
    }
    // サンプル列の遅延＝最後に届いたサンプルの古さ。時計が合っていてもゼロにはならない。
    function streamLagMs(F) { return F.lastTs ? Date.now() - F.lastTs : null; }

    function showClock(F) {
      const el = $('clk' + F.key);
      const c = F.clockOffsetAfter, l = F.streamLag;
      if (c === null || c === undefined) { el.textContent = '–'; el.className = ''; return; }
      el.textContent = '時計' + c + ' / 遅延' + (l === null ? '?' : l) + 'ms';
      el.className = (Math.abs(c) > 200) ? 'warn' : '';
    }

    async function syncClock(F) {
      const el = $('clk' + F.key);
      if (!F.connected || !F.core) { el.textContent = '–'; el.className = ''; return; }
      try {
        el.textContent = '合わせ中…'; el.className = '';
        F.clockOffsetBefore = await measureClockOffset(F);
        await withTimeout(F.core.syncCoreTime(3), 8000, '時計合わせ');
        await new Promise(r => setTimeout(r, 400));
        F.clockOffsetAfter = await measureClockOffset(F);
        F.streamLag = streamLagMs(F);
        showClock(F);
        window.__logLine('時計(' + F.key + '): 合わせ前 ' + F.clockOffsetBefore + 'ms → 合わせ後 ' +
                         F.clockOffsetAfter + 'ms ／ サンプル列の遅延 ' + F.streamLag + 'ms');
      } catch (e) {
        el.textContent = '同期失敗'; el.className = 'warn';
        F.streamLag = streamLagMs(F);
        window.__logLine('時計合わせ失敗(' + F.key + '): ' + (e && e.message ? e.message : e) +
                         ' → 解析は markers[].sensor_ts を使えば影響なし');
      }
    }
    $('clk').onclick = async function () {
      if (recording) { window.__logLine('収録中は時計を合わせません'); return; }
      this.disabled = true;
      try { await syncClock(feet.L); await syncClock(feet.R); }
      catch (e) { window.__logLine('時計: ' + (e && e.message ? e.message : e)); }
      finally { this.disabled = false; }   // ★何があっても押せる状態に戻す
    };

    // ---- 電池残量 ----
    // ORPHEのAPIは％ではなく3段階（0=少ない / 1=普通 / 2=多い）。読めた値をそのまま出す。
    const BAT_TXT = { 0: '少ない ⚠', 1: '普通', 2: '多い' };

    // ①標準のバッテリーサービス(0x180F)を試す＝0-100%で読める。シューズが持っていなければ失敗する。
    async function readBatteryPercent(F) {
      const dev = F.core && F.core.bluetoothDevice;
      if (!dev || !dev.gatt || !dev.gatt.connected) return null;
      const svc = await withTimeout(dev.gatt.getPrimaryService('battery_service'), 4000, 'battery_service');
      const ch  = await withTimeout(svc.getCharacteristic('battery_level'), 4000, 'battery_level');
      const v   = await withTimeout(ch.readValue(), 4000, 'battery_level読み取り');
      return v.getUint8(0);   // 0-100 [%]
    }

    async function readBattery(F) {
      const el = $('bat' + F.key);
      if (!F.connected || !F.core) { el.textContent = '–'; el.className = ''; return; }
      // ① ％で読めるなら％を優先
      try {
        const pct = await readBatteryPercent(F);
        if (pct !== null && pct >= 0 && pct <= 100) {
          el.textContent = pct + ' %';
          el.className = (pct <= 20) ? 'warn' : '';
          F.battery_pct = pct;
          window.__logLine('電池(' + F.key + '): 標準サービスから ' + pct + '%');
          return;
        }
      } catch (e) {
        window.__logLine('電池%は非対応(' + F.key + '): ' + (e && e.message ? e.message : e) + ' → 3段階で表示');
      }
      // ② ORPHE独自の3段階にフォールバック
      try {
        const info = await withTimeout(F.core.getDeviceInformation(), 5000, 'getDeviceInformation');
        const b = info && typeof info.battery === 'number' ? info.battery : null;
        el.textContent = (b !== null && BAT_TXT[b] !== undefined) ? BAT_TXT[b]
                       : (b !== null ? String(b) : '取得失敗');
        el.className = (b === 0) ? 'warn' : '';
        F.battery = b;
      } catch (e) {
        el.textContent = '取得失敗'; el.className = 'warn';
        window.__logLine('電池読み取り失敗(' + F.key + '): ' + (e && e.message ? e.message : e));
      }
    }
    $('bat').onclick = async function () {
      // 収録中はBLEを乱さないよう読まない
      if (recording) { window.__logLine('収録中は電池を読みません（BLEを乱さないため）'); return; }
      this.disabled = true;
      try { await readBattery(feet.L); await readBattery(feet.R); }
      catch (e) { window.__logLine('電池: ' + (e && e.message ? e.message : e)); }
      finally { this.disabled = false; }   // ★何があっても押せる状態に戻す
    };

    // ---- 区間マーカー ----
    // 押すたびに開始/終了が交互になる（表示で次に何を打つか分かる）。
    // 保存はフラットなイベント列＝押し間違いを解析側で解釈し直せる。
    // t_s は「収録開始ビープからの秒」＝解析側の時系列図の横軸と同じ数字。
    function nextKind() { return (markers.length % 2 === 0) ? 'start' : 'end'; }
    function renderMarks() {
      const isEnd = nextKind() === 'end';
      $('mark').textContent = isEnd ? '■ 区間 終了' : '▶ 区間 開始';
      $('mark').className = isEnd ? 'ending' : '';
      $('undo').disabled = markers.length === 0;
      if (!markers.length) { $('marks').textContent = 'マーカーなし'; return; }
      const lines = [];
      for (let i = 0; i < markers.length; i += 2) {
        const a = markers[i], b = markers[i+1];
        const no = String(i/2 + 1).padStart(2,' ');
        lines.push(b ? `${no}) ${a.t_s.toFixed(1)}s → ${b.t_s.toFixed(1)}s   (${(b.t_s-a.t_s).toFixed(1)}s)`
                     : `${no}) ${a.t_s.toFixed(1)}s → …計測中`);
      }
      $('marks').textContent = lines.join('\n');
    }
    function addMarker() {
      if (!recording) return;
      const now = Date.now(), kind = nextKind();
      markers.push({
        n: markers.length + 1, kind: kind,
        epoch_ms: now, t_s: (now - recStart) / 1000,
        // ★CSVと同じ時計（シューズ側）での時刻。切り出しにはこちらを使う
        sensor_ts: { left: feet.L.lastTs || null, right: feet.R.lastTs || null }
      });
      beep(kind === 'start' ? 1760 : 990, 70);   // 収録開始/停止のビープとは別の短い音
      if (navigator.vibrate) { try { navigator.vibrate(kind === 'start' ? 40 : [30,40,30]); } catch(e){} }
      flash(kind === 'start' ? '#7c3aed' : '#ea580c', 120);   // 動画でも押した瞬間が見える
      renderMarks();
    }
    $('mark').onclick = addMarker;
    $('undo').onclick = function () { markers.pop(); renderMarks(); };

    // 対になったマーカーだけを区間に畳む（末尾が開きっぱなしなら収録終了で閉じる）
    function pairedRanges() {
      const out = [];
      for (let i = 0; i < markers.length; i += 2) {
        const a = markers[i], b = markers[i+1];
        out.push({
          index: out.length + 1,
          start_s: +a.t_s.toFixed(3),
          end_s: b ? +b.t_s.toFixed(3) : +((recEnd - recStart)/1000).toFixed(3),
          closed: !!b,
          start_epoch_ms: a.epoch_ms,
          end_epoch_ms: b ? b.epoch_ms : recEnd
        });
      }
      return out;
    }

    // ---- Wake Lock ----
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); }
        else window.__logLine('Wake Lock非対応: 画面が消えると収録が止まる可能性→画面ONを保って');
      } catch (e) { window.__logLine('WakeLock失敗: ' + e.message); }
    }
    function releaseWakeLock() { try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch(e){} }
    document.addEventListener('visibilitychange', function(){
      if (recording && document.visibilityState === 'visible' && !wakeLock) requestWakeLock();
    });

    // ---- 収録 開始 / 停止 ----
    let elapsedTimer = null;
    // 全画面フラッシュ（動画側の同期マーカー）。色で何のイベントかを見分ける
    const C_FLASH_START = '#16a34a';   // 収録開始＝緑
    const C_FLASH_STOP  = '#dc2626';   // 収録停止＝赤
    const FLASH_MS = 150;
    function flash(color, ms) {
      const f = $('flash');
      f.style.background = color;
      f.style.display = 'block';
      setTimeout(function(){ f.style.display = 'none'; }, ms || 150);
    }

    $('rec').onclick = function () {
      ensureAudio();
      feet.L.rec = []; feet.R.rec = [];
      // ★先に画面を変える。t=0 の記録は「その描画が出る直前」に行う。
      //   旧版は await requestWakeLock() を挟んでから画面を変えていたため、
      //   赤が出る瞬間が t=0 より数十ms遅れていた。
      $('rec').style.display = 'none'; $('stop').style.display = ''; $('stop').disabled = false;
      $('downloads').innerHTML = ''; $('summary').style.display = 'none';
      // display は 'block' を明示する。'' だと CSS の #markbar{display:none} が生き残る
      markers = []; $('mark').disabled = false; renderMarks();
      // display は 'block' を明示する。'' だと CSS の #markbar{display:none} が生き残る
      $('markbar').style.display = 'block';
      // 開始＝緑のフラッシュ。ここで表示指定だけしておき、下のrAFで描画と同時に t=0 を取る
      // （白は画面が飛んで最初のコマが分かりにくかったので、マーカーと同じ有彩色にする）
      $('flash').style.background = C_FLASH_START; $('flash').style.display = 'block';

      requestAnimationFrame(function () {
        // このコールバックの直後に上のDOM変更が描画される＝緑が出てボタンが赤に切り替わる瞬間
        recording = true; recStart = Date.now();
        startBeepTs.L = feet.L.lastTs || recStart; startBeepTs.R = feet.R.lastTs || recStart;
        beep(1320, 130);
        setTimeout(function(){ $('flash').style.display = 'none'; }, FLASH_MS);
        requestWakeLock();            // await しない（t=0 を遅らせないため）
        elapsedTimer = setInterval(function(){
          const s = (Date.now() - recStart)/1000;
          $('elapsed').textContent = '● REC  ' + s.toFixed(1) + ' s';
        }, 100);
        updateRecEnabled();
      });
    };

    $('stop').onclick = function () {
      recording = false; recEnd = Date.now();
      endBeepTs.L = feet.L.lastTs || recEnd; endBeepTs.R = feet.R.lastTs || recEnd;
      beep(880, 200);
      flash(C_FLASH_STOP, FLASH_MS);   // 停止＝赤のフラッシュ
      releaseWakeLock();
      clearInterval(elapsedTimer);
      $('elapsed').textContent = '';
      $('stop').style.display = 'none'; $('rec').style.display = ''; updateRecEnabled();
      $('mark').disabled = true; $('undo').disabled = true;   // 区間リストは保存確認用に残す
      buildDownloads();
    };

    // ---- CSV / メタ 生成 → ダウンロードボタン（モバイルは手動タップが確実） ----
    function stamp(d) {
      const p = n => String(n).padStart(2,'0');
      return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
    }
    function mkLink(name, text, blob) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      const b = document.createElement('button'); b.className = 'ghost'; b.textContent = text;
      a.appendChild(b); return a;
    }
    function buildDownloads() {
      const label = ($('label').value || 'run').replace(/[^\w\-]/g,'_');
      const st = stamp(new Date(recStart));
      const durS = (recEnd - recStart)/1000;
      const dl = $('downloads'); dl.innerHTML = '';
      const info = [];
      ['L','R'].forEach(function(k){
        const F = feet[k], side = k==='L' ? 'left' : 'right';
        if (!F.connected && F.rec.length === 0) return;
        const csv = CSV_HEADER + '\n' + F.rec.join('\n') + '\n';
        const fname = label + '_' + st + '_' + side + '_sensor.csv';
        dl.appendChild(mkLink(fname, '⬇ ' + (k==='L'?'左足':'右足') + ' CSV (' + F.rec.length + '行)', new Blob([csv], {type:'text/csv'})));
        const hz = F.rec.length && durS>0 ? (F.rec.length/durS) : 0;
        info.push(k + ': ' + F.rec.length + '行  ' + hz.toFixed(0) + 'Hz  欠損' + F.lost +
                  (F.rec.length && (hz<150||F.lost>durS*3) ? '  ⚠要確認' : '  OK'));
      });
      const meta = {
        label: label, stamp: st,
        start_beep_epoch_ms: recStart, end_beep_epoch_ms: recEnd, duration_s: durS,
        range: { acc: 16, gyro: 2000 },
        markers: markers,
        ranges: pairedRanges(),
        note: 'timestamp=デバイス時刻(PC時計に同期,epoch ms)。start/end_beep_epoch_msはCSV timestampと同じ時計＝動画の同期用。acc/gyroは正規化値(解析側で ×16 / ×2000)、quatは生int16(÷32768で正規化)。markers=収録中に手で打った区間マーカー（フラットなイベント列。t_sはstart_beep_epoch_msからの秒＝解析側の時系列図の横軸と同じ）。ranges=markersを2個ずつ対にして畳んだ解析区間（closed=falseは終了を押さずに収録停止した区間で、収録終了時刻で閉じてある）。feet.*.battery_pctは標準BLEバッテリーサービスから読んだ残量[%]。シューズが対応していなければnullで、その場合はfeet.*.batteryの3段階(0=少ない/1=普通/2=多い)を見る。★時刻に関する3つの値を区別すること。clock_offset_ms=シューズの時計を直接読んで測った「スマホ時計 - シューズ時計」[ms]。これが時計そのもののズレで、v0.5以降は接続時にsyncCoreTimeで合わせるので±200ms以内なら健全。stream_lag_ms=最後に届いたサンプルの古さ[ms]で、これはBLEの転送遅れ。時計が合っていてもゼロにはならない。beep_minus_last_sample_ms=収録開始時点の(スマホ時計 - 最後に届いたサンプルの時刻)で、上の2つを足したもの。★CSVのtimestampが真の時刻かどうかはclock_offset_msだけで決まる（stream_lag_msは無関係）。clock_offset_msが小さければ、CSVのtimestampとstart_beep_epoch_msは同じ時計なので、そのまま引き算してよい。',
        feet: {
          left:  { connected: feet.L.connected, samples: feet.L.rec.length, lost: feet.L.lost, battery: (feet.L.battery !== undefined ? feet.L.battery : null), battery_pct: (feet.L.battery_pct !== undefined ? feet.L.battery_pct : null), clock_offset_ms: (feet.L.clockOffsetAfter !== undefined ? feet.L.clockOffsetAfter : null), clock_offset_before_sync_ms: (feet.L.clockOffsetBefore !== undefined ? feet.L.clockOffsetBefore : null), stream_lag_ms: (feet.L.streamLag !== undefined ? feet.L.streamLag : null), beep_minus_last_sample_ms: (recStart - startBeepTs.L), start_beep_sensor_ts: startBeepTs.L, end_beep_sensor_ts: endBeepTs.L },
          right: { connected: feet.R.connected, samples: feet.R.rec.length, lost: feet.R.lost, battery: (feet.R.battery !== undefined ? feet.R.battery : null), battery_pct: (feet.R.battery_pct !== undefined ? feet.R.battery_pct : null), clock_offset_ms: (feet.R.clockOffsetAfter !== undefined ? feet.R.clockOffsetAfter : null), clock_offset_before_sync_ms: (feet.R.clockOffsetBefore !== undefined ? feet.R.clockOffsetBefore : null), stream_lag_ms: (feet.R.streamLag !== undefined ? feet.R.streamLag : null), beep_minus_last_sample_ms: (recStart - startBeepTs.R), start_beep_sensor_ts: startBeepTs.R, end_beep_sensor_ts: endBeepTs.R },
        }
      };
      dl.appendChild(mkLink(label + '_' + st + '_meta.json', '⬇ meta.json（同期・品質）', new Blob([JSON.stringify(meta,null,2)], {type:'application/json'})));
      const sm = $('summary'); sm.style.display = '';
      const rg = pairedRanges();
      const rgTxt = rg.length
        ? '\n区間 ' + rg.length + '本: ' + rg.map(r => r.start_s.toFixed(1)+'-'+r.end_s.toFixed(1)+'s'+(r.closed?'':'*')).join(', ')
        : '\n区間マーカーなし（全区間が解析対象）';
      sm.textContent = '収録 ' + durS.toFixed(1) + 's  (' + label + '_' + st + ')\n' + info.join('\n') + rgTxt +
                       '\n\n※上のボタンを1つずつタップして保存。\n※CSVは既存の *_sensor.csv と同形式。実験フォルダに置けば compare_all.py / ble_quality_check.py がそのまま読めます。';
    }

    // ---- ライブ表示 ----
    function render() {
      ['L','R'].forEach(function(k){
        const F = feet[k], hz = F.rateWin.length;
        const hzEl = $('hz'+k); hzEl.textContent = (F.connected ? hz : '–') + ' Hz';
        hzEl.className = (F.connected && F.n>0 && hz<150) ? 'warn' : '';
        $('n'+k).textContent = recording ? F.rec.length : F.n;
        const lEl = $('lost'+k); lEl.textContent = F.lost; lEl.className = F.lost>0 ? 'warn' : '';
      });
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  </script>
</body>
</html>
